name: Import source from webhtv

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Clone webhtv source (full history)
        run: |
          git clone --depth 1 https://github.com/Yuhaitao-920/webhtv.git source
          rm -rf source/.git
          echo "Imported $(find source -type f | wc -l) files"

      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          path: dest

      - name: Copy source into repo
        run: |
          # Remove this bootstrap workflow so it does not remain in the result
          rm -f source/.github/workflows/import-source.yml
          cp -a source/. dest/
          cd dest
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Import FongMi TV source from webhtv"
          fi
          git push origin HEAD:main
