name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'APK variant to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - mobileArm64_v8a
          - mobileArmeabi_v7a
          - leanbackArm64_v8a
          - leanbackArmeabi_v7a
      create_release:
        description: 'Create a GitHub Release with the built APK(s)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android packages
        run: sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Write local.properties (debug signing)
        run: printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties

      - name: Build APK(s)
        env:
          VARIANT: ${{ github.event.inputs.variant || 'all' }}
        run: |
          chmod +x ./gradlew
          case "$VARIANT" in
            all)
              TASKS=":app:assembleMobileArm64_v8aDebug :app:assembleMobileArmeabi_v7aDebug :app:assembleLeanbackArm64_v8aDebug :app:assembleLeanbackArmeabi_v7aDebug"
              ;;
            *) TASKS=":app:assemble${VARIANT}Debug" ;;
          esac
          echo "Running: $TASKS"
          ./gradlew $TASKS --no-daemon

      - name: Collect APKs
        run: |
          mkdir -p dist
          find . -type f -name '*.apk' -path '*/build/outputs/*' -exec cp -n {} dist/ \;
          if [ -d Release/apk ]; then find Release/apk -type f -name '*.apk' -exec cp -n {} dist/ \;; fi
          ls -lh dist/
          test -n "$(ls -A dist/*.apk 2>/dev/null)" || { echo "No APK produced" >&2; exit 1; }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fongmi-tv-apks
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create release
        if: ${{ github.event.inputs.create_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: FongMi TV build ${{ github.run_number }}
          files: dist/*.apk
